<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Lindi!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d6f1ec; --paper:#fffdf8; --ink:#2a2347; --muted:#5b5478;
  --pink:#ff5fa2; --orange:#ff8a3d; --sun:#ffd23f; --grape:#6a4cff; --mint:#2ec4a6;
  --shadow:rgba(42,35,71,.25);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d1838; --paper:#2b2450; --ink:#fff4e6; --muted:#c9c0ea; --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#1d1838; --paper:#2b2450; --ink:#fff4e6; --muted:#c9c0ea; --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Nunito",system-ui,sans-serif;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;
}

/* bunting */
.bunting{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:64px;display:flex;justify-content:space-around;pointer-events:none;z-index:2}
.bunting::before{content:"";position:absolute;left:-2%;right:-2%;top:6px;height:3px;background:var(--ink);opacity:.5;border-radius:3px}
.bunting i{width:34px;height:46px;margin-top:8px;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;animation:sway 3.6s ease-in-out infinite}
.bunting i:nth-child(5n+1){background:var(--pink)}
.bunting i:nth-child(5n+2){background:var(--sun)}
.bunting i:nth-child(5n+3){background:var(--mint)}
.bunting i:nth-child(5n+4){background:var(--grape)}
.bunting i:nth-child(5n){background:var(--orange)}
.bunting i:nth-child(even){animation-delay:-1.4s}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* balloons */
.balloon{position:fixed;bottom:-140px;width:56px;height:70px;border-radius:50% 50% 48% 48%;z-index:1;pointer-events:none;
  animation:rise linear infinite;opacity:.9}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:60px;background:var(--ink);opacity:.35}
.balloon::before{content:"";position:absolute;left:14px;top:12px;width:10px;height:18px;border-radius:50%;background:rgba(255,255,255,.45);transform:rotate(20deg)}
@keyframes rise{from{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-60vh) rotate(3deg)}to{transform:translateY(-130vh) rotate(-3deg)}}

/* card */
.stage{position:relative;z-index:3;padding:84px 16px 32px;width:100%;display:flex;justify-content:center;overflow-x:clip;perspective:1600px}
.card{position:relative;width:min(92vw,400px);height:min(560px,calc(100svh - 150px));min-height:480px}
.inside,.cover{position:absolute;inset:0;border-radius:6px 18px 18px 6px}
.inside{background:var(--paper);box-shadow:0 18px 40px var(--shadow);padding:26px 22px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
.cover{
  background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url("Happie.jpg") center/cover;
  transition:transform 1.1s cubic-bezier(.6,.05,.25,1);backface-visibility:hidden;cursor:pointer;
  box-shadow:0 18px 40px var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;border:0;font:inherit;padding:24px
}
.cover:focus-visible,.btn:focus-visible{outline:4px solid var(--sun);outline-offset:4px}
.cover::before{content:"";position:absolute;inset:14px;border:3px dashed rgba(255,255,255,.7);border-radius:6px 14px 14px 6px;pointer-events:none}
.cover h1{font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:clamp(2.6rem,13vw,3.6rem);line-height:1;margin:0;text-shadow:0 3px 0 rgba(42,35,71,.25)}
.cover p{margin:0;font-weight:700;font-size:1.05rem}
.dots{display:flex;gap:10px}
.dots b{width:14px;height:14px;border-radius:50%;background:#fff;opacity:.9}
.dots b:nth-child(2){background:var(--sun)}
.dots b:nth-child(3){background:var(--grape)}
.card.open .cover{transform:rotateY(-172deg);pointer-events:none}

.inside h2{font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:1.9rem;margin:6px 0 4px;color:var(--pink)}
.inside .msg{margin:0 0 6px;color:var(--muted);line-height:1.5;max-width:30ch;min-height:4.5em;font-weight:500}

/* cake */
.cake{position:relative;width:200px;margin:auto 0 8px;flex:none}
.tier{margin:0 auto;border-radius:14px 14px 8px 8px;position:relative}
.t1{width:110px;height:50px;background:var(--grape)}
.t2{width:170px;height:62px;background:var(--pink);margin-top:-2px}
.t3{width:200px;height:20px;background:var(--sun);border-radius:6px;margin-top:2px}
.tier::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:#fff;border-radius:14px 14px 20px 20px;
  -webkit-mask:radial-gradient(circle 9px at 9px 14px,transparent 98%,#000) 0 0/24px 100%;mask:radial-gradient(circle 9px at 9px 14px,transparent 98%,#000) 0 0/24px 100%;opacity:.95}
.candles{display:flex;justify-content:center;gap:16px;height:46px;align-items:flex-end}
.candle{width:9px;height:30px;border-radius:3px;position:relative;background:repeating-linear-gradient(45deg,var(--mint) 0 6px,#fff 6px 12px)}
.flame{position:absolute;left:50%;bottom:100%;width:12px;height:18px;margin-left:-6px;background:radial-gradient(ellipse at 50% 70%,#fff3a8,var(--orange) 70%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate;transition:opacity .4s,transform .4s}
.flame:nth-child(odd){animation-delay:-.15s}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.9,1.12) rotate(4deg)}}
.out .flame{opacity:0;transform:scale(.2);animation:none}
.smoke{position:absolute;left:50%;bottom:100%;width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:0;margin-left:-3px}
.out .smoke{animation:puff 1.4s ease-out}
@keyframes puff{0%{opacity:.6;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-34px) scale(4)}}

.btn{font-family:"Fredoka",system-ui,sans-serif;font-weight:500;font-size:1.05rem;border:0;border-radius:999px;padding:12px 24px;background:var(--grape);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(42,35,71,.35);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(42,35,71,.35)}
.sign{margin-top:12px;font-weight:700;color:var(--muted);font-size:.95rem}
.inside.show-coll{background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.2)),url("coll.jpg") center/cover}
.inside.show-coll h2,.inside.show-coll .msg,.inside.show-coll .sign{color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

@media (prefers-reduced-motion:reduce){
  .bunting i,.balloon,.flame{animation:none}
  .cover{transition-duration:.01s}
}
</style>
</head>
<body>

<div class="bunting" aria-hidden="true"></div>
<div id="balloons" aria-hidden="true"></div>

<main class="stage">
  <div class="card" id="card">
    <section class="inside" id="inside">
      <h2>Happy Birthday, Lindi!!!</h2>
      <p class="msg" id="msg">I can't paint so I made this. Blow out the candles, please ;) and make a wish.</p>
      <div class="cake" id="cake">
        <div class="candles">
          <div class="candle"><span class="flame"></span><span class="smoke"></span></div>
          <div class="candle"><span class="flame"></span><span class="smoke"></span></div>
          <div class="candle"><span class="flame"></span><span class="smoke"></span></div>
        </div>
        <div class="tier t1"></div>
        <div class="tier t2"></div>
        <div class="tier t3"></div>
      </div>
      <button class="btn" id="blow" type="button">Blow out the candles</button>
      <div class="sign">With much love, from Hillz</div>
    </section>
    <button class="cover" id="cover" type="button" aria-label="Open the birthday card">
      <div class="dots" aria-hidden="true"><b></b><b></b><b></b></div>
      <h1>Happy<br>Birthday<br>Lindi!!!</h1>
      <p>Tap to open</p>
    </button>
  </div>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function(){
  var colors=['#ff5fa2','#ff8a3d','#ffd23f','#6a4cff','#2ec4a6'];

  // bunting flags
  var b=document.querySelector('.bunting');
  for(var i=0;i<12;i++){b.appendChild(document.createElement('i'));}

  // balloons
  var bw=document.getElementById('balloons');
  for(var j=0;j<7;j++){
    var el=document.createElement('div');
    el.className='balloon';
    el.style.left=(5+j*14+Math.random()*6)+'%';
    el.style.background=colors[j%colors.length];
    el.style.animationDuration=(14+Math.random()*10)+'s';
    el.style.animationDelay=(-Math.random()*20)+'s';
    bw.appendChild(el);
  }

  // confetti
  var cv=document.getElementById('confetti'),ctx=cv.getContext('2d'),bits=[],running=false;
  function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;}
  size();addEventListener('resize',size);
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function burst(n){
    if(reduce)return;
    for(var k=0;k<n;k++){
      bits.push({x:cv.width/2,y:cv.height*0.45,
        vx:(Math.random()-.5)*16*devicePixelRatio,vy:(-Math.random()*14-4)*devicePixelRatio,
        s:(6+Math.random()*6)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,
        c:colors[(Math.random()*colors.length)|0]});
    }
    if(!running){running=true;requestAnimationFrame(tick);}
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    bits=bits.filter(function(p){return p.y<cv.height+40;});
    bits.forEach(function(p){
      p.vy+=.35*devicePixelRatio;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();
    });
    if(bits.length){requestAnimationFrame(tick);}else{running=false;ctx.clearRect(0,0,cv.width,cv.height);}
  }

  // open card
  var card=document.getElementById('card');
  document.getElementById('cover').addEventListener('click',function(){
    card.classList.add('open');
    setTimeout(function(){burst(80);},700);
    setTimeout(function(){document.getElementById('blow').focus({preventScroll:true});},1100);
  });

  // blow out candles
  var cake=document.getElementById('cake'),btn=document.getElementById('blow'),msg=document.getElementById('msg'),isOut=false;
  btn.addEventListener('click',function(){
    isOut=!isOut;
    cake.classList.toggle('out',isOut);
    if(isOut){
      msg.textContent='May you conquer everything you set your heart and mind on. Continue being amazing and inspiring. May the good Lord grant thee with abundant prosperity and lasting peace. :)';
      btn.textContent='Light them again';
      burst(160);
    }else{
      document.getElementById('inside').classList.add('show-coll');
      btn.textContent='Blow out the candles';
      burst(100);
    }
  });
})();
</script>
</body>
</html>
